# Local test of the production image:
#   docker compose up --build   →   http://localhost:8080
name: kora-frontend

services:
  frontend:
    build: .
    image: kora-frontend:${IMAGE_TAG:-latest}
    restart: unless-stopped
    environment:
      KORA_API_URL: ${KORA_API_URL:-http://localhost:3333}
    ports:
      - '127.0.0.1:8080:8080'
